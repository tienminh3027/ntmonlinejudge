name: Cham bai

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chấm bài
        env:
          TIME_LIMIT: "2"        # giây / test
          MEM_LIMIT_MB: "256"    # MB
        run: python3 judge.py
